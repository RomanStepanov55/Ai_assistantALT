<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Alontito Pet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161615;
               user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
<!-- {{IMPORTMAP}} подставляется сервером приложения: локальный vendor/three или CDN,
     пути привязаны к /pet/… -->
<script type="importmap">{{IMPORTMAP}}</script>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Мост для веба: pet.js писан под Qt WebEngine (console.log '@@PET@@' наружу,
   window.PetApi.recv внутрь). В iframe на любом устройстве то же самое
   делается через postMessage — протокол и рендерер не меняются. */
(function () {
  var pending = [];
  console.log = (function (orig) {
    return function () {
      var s = Array.prototype.join.call(arguments, ' ');
      if (s.indexOf('@@PET@@') === 0) {
        try { parent.postMessage({ pet: s.slice(7) }, '*'); } catch (e) {}
        return;
      }
      return orig.apply(console, arguments);
    };
  })(console.log);
  /* Честный отказ: если сцена умерла (нет WebGL, упал импорт three, кость не
     найдена) — сказать словами, а не молчаливой тёмной пустотой. */
  function paintFail(text) {
    if (document.body.dataset.petFail) return;
    document.body.dataset.petFail = '1';
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;' +
      'justify-content:center;padding:24px;text-align:center;color:#9a9a94;' +
      'font:13px/1.5 system-ui,-apple-system,sans-serif;';
    d.textContent = text;
    document.body.appendChild(d);
  }
  function fail(e) {
    var msg = String((e && (e.message || e.reason)) || 'ошибка сцены');
    paintFail('Персонаж не смог запуститься в этом браузере: ' + msg.slice(0, 160) +
      '. Сцена требует WebGL.');
    try { parent.postMessage({ pet: JSON.stringify({ ev: 'error', msg: msg.slice(0, 300) }) }, '*'); } catch (_) {}
  }
  window.addEventListener('error', fail);
  window.addEventListener('unhandledrejection', fail);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.pet === undefined) return;
    try {
      var msg = (typeof d.pet === 'string') ? JSON.parse(d.pet) : d.pet;
      if (window.PetApi) window.PetApi.recv(msg);
      else pending.push(msg);
    } catch (err) {}
  });
  (function flush() {
    if (window.PetApi) {
      while (pending.length) window.PetApi.recv(pending.shift());
    } else {
      setTimeout(flush, 50);
    }
  })();
})();
</script>
<script type="module" src="/pet/pet.js?v=3"></script>
</body>
</html>
